# SIG Keep Floor Guard + Dusk Release (2026-07-18 rev2)
#
# Two jobs, both by setting policy → Off (heartbeat then releases to the app
# work mode = native MSC). Sets POLICY only; heartbeat is the sole register
# writer.
#
#   1. KEEP FLOOR — SOC ≤ input_number.sig_keep_floor_pct (3 min) while policy
#      is Full Export → Off. Stops a deliberate sell so the overnight reserve
#      survives; MSC then covers the house (and won't export from battery).
#
#   2. DUSK RELEASE — sun below horizon AND no active saving session → Off.
#      Hands the inverter to native MSC (and thence Predbat) for the night.
#      MSC is the correct overnight state: it is HARDWARE self-protecting
#      (inverter's own discharge cut-off), so overnight safety does not depend
#      on the heartbeat staying alive — unlike a held PCS session whose
#      hard-floor clamp lives inside the (possibly dead) heartbeat.
#
# Morning: the day's policy is set by a human / the future plugin from Off.
#
# IMPORTANT: update and commit this file before changing the automation in HA.
# Deploy via ha_config_set_automation config:, NOT python_transform.

id: "1784208297065"
alias: "SIG Keep Floor Guard"
description: >-
  Keep floor (Full Export → Off at the reserve) and dusk release (→ Off /
  native MSC for the night). Sets policy only; heartbeat writes registers.
  Repo: apps/predbat/ha/sig_keep_floor_guard.yaml.
mode: single

trigger:
  - platform: numeric_state
    entity_id: sensor.sigen_plant_battery_state_of_charge
    below: input_number.sig_keep_floor_pct
    for: "00:03:00"
    id: floor_hit
  - platform: state
    entity_id: sun.sun
    to: "below_horizon"
    id: dusk

action:
  - choose:
      - conditions:
          - condition: trigger
            id: floor_hit
          - condition: state
            entity_id: input_select.sig_dispatch_policy
            state: "Full Export"
        sequence:
          - action: input_select.select_option
            target:
              entity_id: input_select.sig_dispatch_policy
            data:
              option: "Off"
      - conditions:
          - condition: trigger
            id: dusk
          - condition: state
            entity_id: binary_sensor.octopus_energy_a_4ba7c915_octoplus_saving_sessions
            state: "off"
          - condition: not
            conditions:
              - condition: state
                entity_id: input_select.sig_dispatch_policy
                state: "Off"
        sequence:
          - action: input_select.select_option
            target:
              entity_id: input_select.sig_dispatch_policy
            data:
              option: "Off"
