# SIG Keep Floor Guard (2026-07-18 rev)
#
# Preserves the overnight reserve by stopping a deliberate SELL (Full Export /
# saving session) at the keep floor. Sets the POLICY select only — the
# heartbeat is the sole register writer (single-writer doctrine). The absolute
# hard floor is now a live clamp inside the heartbeat, so this guard no longer
# needs a hard-floor branch.
#
#   SOC ≤ input_number.sig_keep_floor_pct (3 min) while policy is Full Export
#     → switch policy to Load Only: stop selling, cover the house from the
#       reserve; the heartbeat's hard-floor clamp stops battery discharge at
#       sig_hard_floor_pct.
#   PV back above 1.5 kW (10 min) while policy is Load Only
#     → switch policy to Off: release to the app work mode / next owner for
#       the new day.
#
# IMPORTANT: update and commit this file before changing the automation in HA.
# Deploy via ha_config_set_automation config:, NOT python_transform.

id: "1784208297065"
alias: "SIG Keep Floor Guard"
description: >-
  Stops a deliberate sell at the overnight keep floor (Full Export → Load Only)
  and releases Load Only back to Off when PV returns. Sets policy only; the
  heartbeat writes registers. Repo: apps/predbat/ha/sig_keep_floor_guard.yaml.
mode: single

trigger:
  - platform: numeric_state
    entity_id: sensor.sigen_plant_battery_state_of_charge
    below: input_number.sig_keep_floor_pct
    for: "00:03:00"
    id: floor_hit
  - platform: numeric_state
    entity_id: sensor.sigen_plant_pv_power
    above: 1.5
    for: "00:10:00"
    id: pv_back

action:
  - choose:
      - conditions:
          - condition: trigger
            id: floor_hit
          - condition: state
            entity_id: input_select.sig_dispatch_policy
            state: "Full Export"
        sequence:
          - action: input_select.select_option
            target:
              entity_id: input_select.sig_dispatch_policy
            data:
              option: "Load Only"
      - conditions:
          - condition: trigger
            id: pv_back
          - condition: state
            entity_id: input_select.sig_dispatch_policy
            state: "Load Only"
        sequence:
          - action: input_select.select_option
            target:
              entity_id: input_select.sig_dispatch_policy
            data:
              option: "Off"
