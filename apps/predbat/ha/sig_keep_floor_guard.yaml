# SIG Keep Floor Guard + Dusk Release
#
# Two jobs, both by stopping whatever is driving a Max Export sell:
#
#   1. KEEP FLOOR — SOC <= input_number.sig_keep_floor_pct (3 min) while the
#      EFFECTIVE policy is Max Export. Stops a deliberate sell so the overnight
#      reserve survives; MSC then covers the house.
#
#   2. DUSK RELEASE — sun below horizon AND no active saving session. Hands to
#      native MSC for the night. MSC is HARDWARE self-protecting (inverter
#      discharge cut-off), so overnight safety does not depend on the heartbeat
#      staying alive — unlike a held PCS session.
#
# NOTE: the CM's primary handover is at safe_time (RD6); the dusk trigger is the
# BACKSTOP for a still-active policy or override the plugin did not clear.
#
# RD13a FIX (2026-07-30) — WHY THIS WATCHES AND WRITES TWO ENTITIES
# -----------------------------------------------------------------
# The heartbeat resolves the policy it executes as:
#
#     effective = override      if override not in ('Off', unknown, ...)
#                 'Max Export'  if a saving session is live and raw != Predbat
#                 raw_policy    otherwise
#
# This guard originally watched and wrote input_select.sig_dispatch_policy
# alone, which predates the override layer. With sig_override held at
# "Max Export" it was doubly broken:
#
#   1. its CONDITION tested sig_dispatch_policy — not what was driving — so the
#      keep-floor branch never fired at all; and
#   2. its ACTION wrote sig_dispatch_policy, which the override outranks, so
#      even had it fired the sell would have continued.
#
# Under a manual Max Export override the keep floor therefore did not exist, and
# the battery would drain straight through it.
#
# It now tests the EFFECTIVE policy and clears BOTH layers. Clearing only the
# override hands back to a policy select that may itself still say Max Export;
# clearing only the policy leaves the override in charge. Writing both stops the
# sell whichever layer was driving, and is idempotent.
#
# DELIBERATELY OUT OF SCOPE: the saving-session arm of `effective`. A live
# session is a deliberate dump and the dusk branch already stands off for one;
# the session sell is bounded at the hardware level by the heartbeat's
# sig_drain_floor_pct clamp, not here. Widening this guard to cut a session
# short is a separate decision — do not add it as a side effect.
#
# IMPORTANT: update and commit this file before changing the automation in HA.
# Run tests/test_yaml_keep_floor_guard.py, then deploy via
# ha_config_set_automation config:, NOT python_transform.

id: "1784208297065"
alias: "SIG Keep Floor Guard"
description: >-
  Keep floor (stop a Max Export sell at the reserve) and dusk backstop release
  (-> Predbat / native MSC for the night). Clears BOTH sig_override and
  sig_dispatch_policy because the heartbeat lets the override outrank the
  policy (RD13a). Sets selects only; the heartbeat writes registers.
  Repo: apps/predbat/ha/sig_keep_floor_guard.yaml.
mode: single

triggers:
  - trigger: numeric_state
    entity_id: sensor.sigen_plant_battery_state_of_charge
    below: input_number.sig_keep_floor_pct
    for: "00:03:00"
    id: floor_hit
  - trigger: state
    entity_id: sun.sun
    to: "below_horizon"
    id: dusk

actions:
  - choose:
      # --- 1. KEEP FLOOR: SOC at the reserve while EFFECTIVELY selling --------
      - conditions:
          - condition: trigger
            id: floor_hit
          # "Is a Max Export sell actually happening?" — ask the SINGLE SOURCE OF
          # TRUTH (RD26). This used to rebuild the override > session > select
          # precedence out of HA conditions, which is a fourth copy of that rule.
          # A copy that drifts here silently disables the keep floor — precisely
          # the 2026-07-30 RD13a bug this guard was rewritten to fix, and it could
          # return the same way. Reading the sensor makes that impossible.
          #
          # NB this now also covers the SESSION arm, which the hand-rolled version
          # deliberately excluded. That is safe: a live session only reaches
          # "Max Export" here if the select is not on handback, and the sell is
          # still bounded by the heartbeat's sig_drain_floor_pct clamp. The DUSK
          # branch keeps its own explicit session hold-off below.
          - condition: state
            entity_id: sensor.sig_effective_policy
            state: "Max Export"
        sequence:
          # RD27: stop the SELL, not the ownership. Both layers must stop saying
          # Max Export — clearing only the override hands back to a select that
          # may still say Max Export, and clearing only the select leaves the
          # override in charge — but the destination is HOLD BATTERY, not Predbat.
          #
          # Writing Predbat here was a mid-window HANDBACK, the same rule RD27
          # removed from two places in the plugin. This guard was the third, and
          # the only one still live. Live 2026-08-06: keep floor 2.0%, SOC ~1.3%,
          # override "Max Export" — the guard fired at 11:38:25.79 and 60 ms later
          # the select read Predbat. Predbat was read-only with all three mappers
          # disabled, so nothing drove and the plant fell through to the SIG's own
          # Maximum Self Consumption default, charging the battery through the
          # pre-overflow window. It also cancelled the user's override ~3 min after
          # they set it, twice, which read as "Max Export does not work".
          #
          # Hold Battery stops the sell (battery flat, PV surplus still exports)
          # while CM keeps the wheel. Handing back is a window-END decision — that
          # is the DUSK branch below, which still writes Predbat and is correct.
          - action: input_select.select_option
            target:
              entity_id: input_select.sig_override
            data:
              option: "Off"
          - action: input_select.select_option
            target:
              entity_id: input_select.sig_dispatch_policy
            data:
              option: "Hold Battery"

      # --- 2. DUSK RELEASE ---------------------------------------------------
      - conditions:
          - condition: trigger
            id: dusk
          - condition: state
            entity_id: binary_sensor.octopus_energy_a_4ba7c915_octoplus_saving_sessions
            state: "off"
          # Skip if already fully released on BOTH layers — keeps this a no-op.
          - condition: not
            conditions:
              - condition: and
                conditions:
                  - condition: state
                    entity_id: input_select.sig_override
                    state: "Off"
                  - condition: state
                    entity_id: input_select.sig_dispatch_policy
                    state: "Predbat"
        sequence:
          - action: input_select.select_option
            target:
              entity_id: input_select.sig_override
            data:
              option: "Off"
          - action: input_select.select_option
            target:
              entity_id: input_select.sig_dispatch_policy
            data:
              option: "Predbat"
