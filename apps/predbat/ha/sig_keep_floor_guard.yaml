# SIG Keep Floor Guard + Dusk Release (2026-07-18 rev, renamed policies)
#
# Two jobs, both by setting policy → Predbat (heartbeat then releases to the
# app work mode = native MSC; interim, until the Predbat mapper is wired).
# Sets POLICY only; heartbeat is the sole register writer.
#
#   1. KEEP FLOOR — SOC ≤ input_number.sig_keep_floor_pct (3 min) while policy
#      is Max Export → Predbat. Stops a deliberate sell so the overnight reserve
#      survives; MSC then covers the house.
#
#   2. DUSK RELEASE — sun below horizon AND no active saving session → Predbat.
#      Hands to native MSC for the night. MSC is HARDWARE self-protecting
#      (inverter discharge cut-off), so overnight safety does not depend on the
#      heartbeat staying alive — unlike a held PCS session.
#
# NOTE: the CM's primary handover is at safe_time (RD6); this dusk trigger is
# the BACKSTOP for a still-active manual policy the plugin didn't clear.
#
# IMPORTANT: update and commit this file before changing the automation in HA.
# Deploy via ha_config_set_automation config:, NOT python_transform.

id: "1784208297065"
alias: "SIG Keep Floor Guard"
description: >-
  Keep floor (Max Export → Predbat at the reserve) and dusk backstop release
  (→ Predbat / native MSC for the night). Sets policy only; heartbeat writes
  registers. Repo: apps/predbat/ha/sig_keep_floor_guard.yaml.
mode: single

trigger:
  - platform: numeric_state
    entity_id: sensor.sigen_plant_battery_state_of_charge
    below: input_number.sig_keep_floor_pct
    for: "00:03:00"
    id: floor_hit
  - platform: state
    entity_id: sun.sun
    to: "below_horizon"
    id: dusk

action:
  - choose:
      - conditions:
          - condition: trigger
            id: floor_hit
          - condition: state
            entity_id: input_select.sig_dispatch_policy
            state: "Max Export"
        sequence:
          - action: input_select.select_option
            target:
              entity_id: input_select.sig_dispatch_policy
            data:
              option: "Predbat"
      - conditions:
          - condition: trigger
            id: dusk
          - condition: state
            entity_id: binary_sensor.octopus_energy_a_4ba7c915_octoplus_saving_sessions
            state: "off"
          - condition: not
            conditions:
              - condition: state
                entity_id: input_select.sig_dispatch_policy
                state: "Predbat"
        sequence:
          - action: input_select.select_option
            target:
              entity_id: input_select.sig_dispatch_policy
            data:
              option: "Predbat"
