# Curtailment Manager - Dynamic Export Limit
# HA automation: event-driven export control for curtailment system.
#
# Manual override: input_select.curtailment_manual_hold — Off / Charge / Hold / Drain
#   Off:    plugin controls export (default)
#   Charge: force export = 0 — battery absorbs all PV (emergency curtailment)
#   Hold:   force export = min(excess, DNO) — clamp at available PV
#   Drain:  force export = DNO — force battery discharge to grid
#
# Automation-decided phases (when manual = Off and plugin active).
# Schmitt-trigger hysteresis uses current phase (input_text.curtailment_live_phase)
# to decide the next phase:
#   Drain:   exit → Hold at SOC ≤ target          (drain ALL the way to target)
#   Charge:  exit → Hold at SOC ≥ target          (charge ALL the way to target)
#   Hold:    exit → Drain at SOC > target + OUTER
#            exit → Charge at SOC < target − OUTER
#   OUTER_THRESHOLD_KWH = 0.18 kWh ≈ 1% of soc_max — robust to Sigen SOC 0.1% quantisation.
# Bootstrap (current phase = Off/unknown/Hold from prior manual): symmetric ±OUTER pick.
#
# Charge phase — soft (rate-paced): export = max(0, excess − rate) where
#   rate = max(0, target_kwh − soc_kwh) / hours_until_safe_time
# rate is the slowest charge that closes the SOC-vs-target gap by safe_time.
# It self-adjusts to forecast error: if PV under-forecasts or load over-
# forecasts, the gap grows and the rate grows in lockstep. During active
# overflow (excess > DNO) the DNO clamp dominates and battery passively
# absorbs excess-DNO — no aggressive charging mid-overflow (which would
# overshoot target and reduce safety headroom against SIG voltage faults).
#
# EMS mode management:
#   Manual != Off OR plugin active → Command Discharging (ESS First)
#   Both off → Maximum Self Consumption (normal operation)
#
# Voltage-based cap (sensor.sig_voltage_max_export_kw):
#   Continuous proportional throttle from a template sensor that reads phase A
#   voltage and the input_number helpers (voltage_throttle_upper_v,
#   voltage_throttle_range_v). At normal voltage = dno (no effect). At upper
#   threshold drops to 0. Min'd into every active path so it overrides phase
#   intent during overvoltage. Replaces the old separate-writer voltage_protect
#   automation — voltage_protect now only emits notifications.
#
# IMPORTANT: Update and commit this file before changing the automation in HA.
# Deploy: paste into HA automation editor (raw config mode).

id: "1773747411848"
alias: "Curtailment Manager - Dynamic Export Limit"
description: >-
  Export control with manual override (Off/Charge/Hold/Drain) and automation-decided phases.
  Schmitt-trigger hysteresis: drain/charge runs all the way to target, Hold exits at ±0.18 kWh.
  Plugin publishes target and Active/Off; automation handles fast (5-sec) phase transitions.
  When both manual and plugin off, restores Maximum Self Consumption mode.
mode: single

trigger:
  - entity_id: sensor.sigen_plant_pv_power
    id: pv_load_change
    platform: state
  - entity_id: sensor.sigen_plant_consumed_power
    id: pv_load_change
    platform: state
  - entity_id: sensor.sigen_plant_battery_state_of_charge
    id: soc_change
    platform: state
  - entity_id: sensor.predbat_curtailment_target_soc
    id: target_change
    platform: state
  - entity_id: input_select.curtailment_manual_hold
    platform: state
  # Re-evaluate when the asymmetrically rate-limited cap changes — drops are
  # immediate (snap down on voltage spike) but rises are limited to ~0.667 kW
  # per 5s tick (full 0→4 kW recovery in 30s). Breaks the 5s bang-bang
  # oscillation observed when reading the raw cap directly.
  - entity_id: input_number.voltage_throttle_filtered_cap
    id: voltage_cap_change
    platform: state

condition:
  - condition: or
    conditions:
      # Manual override active
      - condition: not
        conditions:
          - condition: state
            entity_id: input_select.curtailment_manual_hold
            state: "Off"
      # Plugin active and already in D-ESS (continue managing)
      - condition: and
        conditions:
          - condition: not
            conditions:
              - condition: state
                entity_id: sensor.predbat_curtailment_phase
                state:
                  - unavailable
                  - unknown
                  - "Off"
          - condition: state
            entity_id: select.sigen_plant_remote_ems_control_mode
            state: "Command Discharging (ESS First)"
      # Both off and EMS not MSC — trigger MSC restoration
      - condition: and
        conditions:
          - condition: state
            entity_id: input_select.curtailment_manual_hold
            state: "Off"
          - condition: state
            entity_id: sensor.predbat_curtailment_phase
            state: "Off"
          - condition: not
            conditions:
              - condition: state
                entity_id: select.sigen_plant_remote_ems_control_mode
                state: "Maximum Self Consumption"

action:
  - variables:
      soc_kwh: "{{ states('sensor.sigen_plant_battery_state_of_charge') | float(50) / 100.0 * 18.08 }}"
      target_kwh: "{{ state_attr('sensor.predbat_curtailment_target_soc', 'target_kwh') | float(18.08) }}"
      pv: "{{ states('sensor.sigen_plant_pv_power') | float(0) }}"
      load: "{{ states('sensor.sigen_plant_consumed_power') | float(0) }}"
      excess: "{{ pv - load }}"
      dno: 4
      outer_threshold: 0.18
      export_cap_raw: "{{ states('sensor.predbat_curtailment_export_target') | float(-2) }}"
      export_cap: "{% if export_cap_raw | float(-2) >= 0 %}{{ export_cap_raw | float(dno) }}{% else %}{{ dno }}{% endif %}"
      # Voltage-based cap (sensor.sig_voltage_max_export_kw): continuous ramp
      # 0..dno based on phase A voltage. At normal voltage = dno (no effect).
      # As voltage rises past upper-range threshold, this drops toward 0,
      # forcing export down to absorb into battery and unload the feeder.
      # Asymmetric rate-limited cap — drops are immediate, rises capped at
      # 0.667 kW per 5s (full recovery in 30s). Breaks tight oscillation.
      voltage_cap: "{{ states('input_number.voltage_throttle_filtered_cap') | float(dno) }}"
      manual_mode: "{{ states('input_select.curtailment_manual_hold') }}"
      current_phase: "{{ states('input_text.curtailment_live_phase') }}"
      # Soft-charge controller: rate to track target_kwh by safe_time. Slowest
      # sufficient pace. Compensates for the 10% safety margin in target plus
      # any actual-vs-forecast divergence (lower PV / higher load → bigger gap
      # → bigger rate). During active overflow (excess > DNO) the DNO clamp
      # below dominates, so battery passively absorbs excess-DNO — no
      # aggressive charging while overflow is happening (which would overshoot
      # target and reduce safety headroom).
      gap_kwh: "{{ [target_kwh - soc_kwh, 0] | max }}"
      hours_remaining: >-
        {%- set safe_str = state_attr('sensor.predbat_curtailment_phase', 'safe_time') -%}
        {%- if safe_str and safe_str not in ['none', 'unknown', 'unavailable'] -%}
          {{ ((today_at(safe_str) - now()).total_seconds() / 3600) | round(3) }}
        {%- else -%}-1{%- endif -%}
      charge_rate_kw: >-
        {%- if hours_remaining | float(-1) > 0 and gap_kwh | float(0) > 0 -%}
          {{ (gap_kwh / (hours_remaining | float)) | round(2) }}
        {%- else -%}0{%- endif -%}
      # Schmitt-trigger phase selection. For automated phases (when not manual/Off), the
      # next phase depends on both (soc vs target) AND the current phase.
      phase: >-
        {% if manual_mode == 'Charge' %}Manual Charge
        {% elif manual_mode == 'Hold' %}Manual Hold
        {% elif manual_mode == 'Drain' %}Manual Drain
        {% elif export_cap_raw < 0 %}Off
        {% elif current_phase == 'Drain' %}
          {% if soc_kwh > target_kwh %}Drain{% else %}Hold{% endif %}
        {% elif current_phase == 'Charge' %}
          {% if soc_kwh < target_kwh %}Charge{% else %}Hold{% endif %}
        {% elif current_phase == 'Hold' %}
          {% if soc_kwh > target_kwh + outer_threshold %}Drain
          {% elif soc_kwh < target_kwh - outer_threshold %}Charge
          {% else %}Hold
          {% endif %}
        {% else %}
          {# Bootstrap — prior state was Off / Manual / unknown. Pick symmetric. #}
          {% if soc_kwh > target_kwh + outer_threshold %}Drain
          {% elif soc_kwh < target_kwh - outer_threshold %}Charge
          {% else %}Hold
          {% endif %}
        {% endif %}
      new_limit: >-
        {# voltage_cap is a continuous proportional throttle (0..dno) tied to
           grid voltage. min'd into every active path so an overvoltage event
           clamps export regardless of what phase the system is in. Manual
           Charge / explicit Charge stay at 0 (already at floor). #}
        {% if phase == 'Manual Charge' %}
          {{ 0 | round(1) }}
        {% elif phase == 'Manual Hold' %}
          {{ [[excess, 0] | max, voltage_cap, dno] | min | round(1) }}
        {% elif phase == 'Manual Drain' %}
          {{ [voltage_cap, dno] | min | round(1) }}
        {% elif phase == 'Off' %}
          {{ [voltage_cap, dno] | min | round(1) }}
        {% elif phase == 'Drain' %}
          {{ [[export_cap, 0] | max, voltage_cap, dno] | min | round(1) }}
        {% elif phase == 'Charge' %}
          {# Soft-charge: leave charge_rate_kw of excess for battery, export
             the rest. Capped by voltage_cap and DNO. During active overflow
             (excess > DNO) the DNO clamp dominates and battery passively
             absorbs excess-DNO. If safe_time is invalid, fall back to legacy
             export=0 behaviour. #}
          {% if hours_remaining | float(-1) <= 0 %}
            {{ [voltage_cap, 0] | min | round(1) }}
          {% else %}
            {{ [[excess - charge_rate_kw, 0] | max, voltage_cap, dno] | min | round(1) }}
          {% endif %}
        {% else %}
          {# Hold #}
          {{ [[excess, 0] | max, export_cap | float(dno), voltage_cap, dno] | min | round(1) }}
        {% endif %}
      current_limit: "{{ states('number.sigen_plant_grid_export_limitation') | float(-1) | round(1) }}"

  # Switch to D-ESS when manual override active
  - if:
      - condition: template
        value_template: "{{ manual_mode != 'Off' and states('select.sigen_plant_remote_ems_control_mode') != 'Command Discharging (ESS First)' }}"
    then:
      - action: select.select_option
        target:
          entity_id: select.sigen_plant_remote_ems_control_mode
        data:
          option: "Command Discharging (ESS First)"

  # Restore MSC when both manual and plugin off
  - if:
      - condition: template
        value_template: "{{ manual_mode == 'Off' and states('sensor.predbat_curtailment_phase') == 'Off' and states('select.sigen_plant_remote_ems_control_mode') != 'Maximum Self Consumption' }}"
    then:
      - action: select.select_option
        target:
          entity_id: select.sigen_plant_remote_ems_control_mode
        data:
          option: "Maximum Self Consumption"

  # Publish live phase
  - if:
      - condition: template
        value_template: "{{ phase != current_phase }}"
    then:
      - action: input_text.set_value
        target:
          entity_id: input_text.curtailment_live_phase
        data:
          value: "{{ phase }}"

  - condition: template
    value_template: "{{ (new_limit | float - current_limit | float) | abs >= 0.05 }}"

  - action: number.set_value
    target:
      entity_id: number.sigen_plant_grid_export_limitation
    data:
      value: "{{ new_limit }}"
