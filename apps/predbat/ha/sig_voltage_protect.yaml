# SIG Voltage Protect — notifications only (v2)
#
# As of 2026-04-27, the proportional voltage throttle moved out of this
# automation. The actual export cap is now produced by a template sensor
# (sensor.sig_voltage_max_export_kw) reading phase A voltage and the helpers
# input_number.voltage_throttle_upper_v / voltage_throttle_range_v. The
# curtailment automation (curtailment_manager_dynamic_export_limit) reads
# that sensor and min's it into every export decision — single writer, no
# race with this automation.
#
# This automation now exists only for notifications:
#   - Alert Andrew when the cap drops below 3.5 kW (throttle engaging)
#   - Alert Andrew when the cap returns to ~DNO (throttle releasing)
#   - Toggle input_boolean.sig_voltage_protect_active for dashboard visibility
#
# Tuning the throttle curve:
#   input_number.voltage_throttle_upper_v   — voltage at which cap → 0
#                                              (default 263V)
#   input_number.voltage_throttle_range_v   — span of linear ramp from cap=DNO
#                                              up to cap=0
#                                              (default 7V → engagement at 256V)
#
# IMPORTANT: Update and commit this file before changing the automation in HA.

id: "sig_voltage_protect_v1"
alias: "SIG Voltage Protect"
description: >-
  Two-stage. input_boolean.sig_voltage_protect_active reflects real-time
  throttle state (immediate, no debounce). Notifications fire only when
  the boolean has been sustained on/off for 1 minute, gated by an
  "alerted" flag so release alerts don't fire without a preceding engage.

mode: queued
max: 6
max_exceeded: silent

trigger:
  # Real-time boolean toggle — immediate when cap drops or recovers
  - platform: numeric_state
    entity_id: sensor.sig_voltage_max_export_kw
    below: 3.95
    id: throttle_start
  - platform: numeric_state
    entity_id: sensor.sig_voltage_max_export_kw
    above: 3.99
    id: throttle_end
  # Notification triggers — debounced via state-with-for on the boolean
  - platform: state
    entity_id: input_boolean.sig_voltage_protect_active
    to: "on"
    for: "00:01:00"
    id: notify_engage
  - platform: state
    entity_id: input_boolean.sig_voltage_protect_active
    to: "off"
    for: "00:01:00"
    id: notify_release

action:
  - variables:
      cap: "{{ states('sensor.sig_voltage_max_export_kw') | float(4) }}"
      voltage: "{{ states('sensor.sigen_inverter_phase_a_voltage') | float(240) }}"
      soc: "{{ states('sensor.sigen_plant_battery_state_of_charge') }}"

  - choose:
      # Throttle started — flip boolean ON immediately, count every event
      # (sub-10s flickers also do real work clamping voltage spikes).
      # Notification still gated by 10s sustained via notify_engage.
      - conditions:
          - condition: trigger
            id: throttle_start
        sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.sig_voltage_protect_active
          - action: counter.increment
            target:
              entity_id: counter.voltage_throttle_activations_today

      # Throttle ended — flip boolean OFF immediately, no notification yet
      - conditions:
          - condition: trigger
            id: throttle_end
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.sig_voltage_protect_active

      # Boolean has been ON sustained 10s — fire engage notification once,
      # snapshot the lost-energy meter so release can compute the session's
      # delta.
      - conditions:
          - condition: trigger
            id: notify_engage
          - condition: state
            entity_id: input_boolean.sig_voltage_protect_alerted
            state: "off"
        sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.sig_voltage_protect_alerted
          - action: input_number.set_value
            target:
              entity_id: input_number.voltage_throttle_engage_lost_start
            data:
              value: "{{ states('sensor.sig_voltage_throttle_lost_energy') | float(0) }}"
          - action: notify.mobile_app_andrew_iphone
            data:
              title: "⚠️ Voltage throttle engaged (V={{ voltage }}V)"
              message: >-
                Cap at {{ cap }} kW (sustained 1 min). Curtailment automation
                clamping export. SOC: {{ soc }}%

      # Boolean has been OFF sustained 10s AFTER an engage — fire release
      - conditions:
          - condition: trigger
            id: notify_release
          - condition: state
            entity_id: input_boolean.sig_voltage_protect_alerted
            state: "on"
        sequence:
          - variables:
              # Duration since alerted went on (= since notify_engage fired)
              alerted_since: >-
                {{ as_timestamp(states.input_boolean.sig_voltage_protect_alerted.last_changed) }}
              elapsed_seconds: >-
                {{ (as_timestamp(now()) - alerted_since) | int }}
              duration_str: >-
                {%- set m = elapsed_seconds // 60 -%}
                {%- set s = elapsed_seconds % 60 -%}
                {%- if m > 0 -%}{{ m }}m {{ s }}s{%- else -%}{{ s }}s{%- endif -%}
              # Energy lost during this session (kWh delta)
              lost_now: "{{ states('sensor.sig_voltage_throttle_lost_energy') | float(0) }}"
              lost_start: "{{ states('input_number.voltage_throttle_engage_lost_start') | float(0) }}"
              lost_session_kwh: "{{ (lost_now - lost_start) | round(2) }}"
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.sig_voltage_protect_alerted
          - action: notify.mobile_app_andrew_iphone
            data:
              title: "✅ Voltage throttle released (V={{ voltage }}V)"
              message: >-
                Active {{ duration_str }}. Lost ~{{ lost_session_kwh }} kWh
                export. Cap back to {{ cap }} kW. SOC: {{ soc }}%
