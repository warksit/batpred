alias: SIG Manual Override Failsafe Off
description: >-
  Nightly failsafe: clears input_boolean.sig_manual_override at 23:00 (after
  sundown, before any pre-dawn curtailment drain window ~01:00-04:00). A left-on
  manual override blocks the plugin's automated pre-PV drain because the plugin
  skips policy writes while it is on (RD13). This ensures a forgotten override
  never silently disables the morning drain.
trigger:
  - platform: time
    at: "23:00:00"
condition:
  - condition: state
    entity_id: input_boolean.sig_manual_override
    state: "on"
action:
  - service: input_boolean.turn_off
    target:
      entity_id: input_boolean.sig_manual_override
mode: single
