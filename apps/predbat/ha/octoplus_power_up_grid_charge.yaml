# Octoplus Power Up — grid charge
#
# Octopus "Power Up" = FREE ELECTRICITY. Import is free for the window, so the
# right move is to take as much as the plant will accept: charge the battery
# from the grid, then sell it back later at the export rate.
#
# WHAT DECIDES A POWER UP IS NOT HERE. It is one pair of template binary sensors
# in ha/octoplus_session_helpers.yaml, and the reasoning is in
# ha/OCTOPUS_SESSIONS.md. In short: Octopus publish Power Ups and Power Downs on
# ONE feed with no type field, so the calendar cannot be the trigger — it is on
# for both, and triggering off it would grid-charge during a real saving session,
# importing 6.6 kW in the hour you are paid a premium to export.
#
# This automation must never re-implement that test. Four copies of it lived in
# this file before 2026-08-16 (trigger, gate, wait, comment) and the discriminator
# is expected to change when upstream #1590 lands. One definition, one place.
#
# WHAT THIS DOES — AND NO LONGER DOES (rewritten 2026-10-11).
# It gets CM out of Predbat's way for the window, and puts it back. That is all.
# It writes no inverter register, no EMS mode, and never touches Predbat's
# mapper automations.
#
# Why. Until 2026-10-10 Predbat knew nothing about free sessions, so this file
# did the charge itself: stand everyone down, disable the three mappers, write
# -6.6 kW to active_power_fixed_adjustment. Two things changed:
#   * Predbat now prices the window at 0p (octopus_free_electricity in apps.yaml)
#     and plans the charge; and
#   * the stock mapper's Charging is Command Charging (PV First), which measured
#     live fills the battery at its 8.8 kW limit with ALL the PV (2026-10-11:
#     battery 8.8, PV 4.7, AC import 4.1). Nothing here can do better.
#
# The live failure that forced the rewrite, 2026-10-11 13:00. Predbat was driving
# (CM stood down, no overflow risk). This automation took the plant anyway:
# mappers off - which froze the inverter in the Command Discharging (PV First)
# Predbat had set at 12:51 - then a -6.6 setpoint that mode ignores. It never set
# a mode itself; it had only ever run with CM driving, where PCS Remote Control
# was already in place. The plant exported 3.6 kW into a free-import hour for 15
# minutes while Predbat asked for "Charging" with no path to deliver it.
#
# OWNERSHIP (Andrew, 2026-10-11: "That automation is for when cm is in charge").
#   Predbat driving  -> do nothing. It is already charging on its own plan.
#   CM driving       -> switch curtailment_manager_enable off. CM's own release
#                       path hands the registers back (one writer for that
#                       handover, not two); Predbat then charges. Switch it back
#                       on when the window closes.
#   Manual override  -> do nothing. A person driving outranks a free session.
#
# COST, STATED: with CM driving, the handover is not instant. CM releases on its
# next cycle (up to 5 min) and Predbat acts on the cycle after (up to 5 more), so
# a session that opens with CM on the wheel can lose up to ~10 minutes. The old
# direct write was faster and was also the thing that broke. Closing that gap
# belongs in the plugin (stand down ahead of a known Power Up, as RD14-own looks
# ahead for a Power Down), not here.
#
# NO TIMED WAIT. The old version held a wait_for_trigger with a 70-minute
# timeout, written for one-hour sessions; on a two-hour session it "finished" at
# +70 min and re-took the plant on the next sweep. Each run here ends at once.
# What is owed across the window lives in input_boolean.power_up_cm_stood_down,
# which survives an HA restart - so there is no in-flight state to lose and no
# separate recovery path to keep right.
#
# THE FLAG IS LOAD-BEARING. curtailment_manager_enable is the master switch. If a
# person has it off, a free session must not turn it back on, so the restore is
# owed only when this automation recorded that IT stood CM down. Flag on BEFORE
# CM off, and CM on BEFORE flag off: a crash between either pair leaves a restore
# still owed, never a CM silently left off.
#
# EVERY GATE IS A NATIVE CONDITION - no templates. tests/test_yaml_octoplus_sessions.py
# evaluates the real conditions over the ownership matrix and refuses anything
# it cannot evaluate.
#
# IMPORTANT: Update and commit this file before changing the automation in HA.

id: "1786900000002"
alias: "Octoplus Power Up - grid charge"
description: >-
  During an Octopus Power Up (free electricity) window, stand the Curtailment
  Manager down if it is driving so Predbat can take the free energy, and switch
  it back on when the window closes. Does nothing while Predbat is already
  driving or a manual override is set. Writes no inverter register.
mode: single
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: binary_sensor.octoplus_power_up_active
    to: "on"
    id: window_open
  - trigger: state
    entity_id: binary_sensor.octoplus_power_up_active
    to: "off"
    id: window_close
  - trigger: state
    entity_id: binary_sensor.octoplus_power_up_active
    to: "on"
    for:
      minutes: 10
    id: ten_minutes_in
  - trigger: homeassistant
    event: start
    id: recover

  # Backstop for a missed edge in either direction, and the path that catches CM
  # taking the wheel part-way through a window. Every branch below is gated, so
  # this does nothing at all outside the two cases that need it.
  - trigger: time_pattern
    minutes: "/5"
    id: sweep

actions:
  - choose:
      # --- CM is driving into a free session: get it out of Predbat's way ---
      - conditions:
          - condition: state
            entity_id: binary_sensor.octoplus_power_up_active
            state: "on"
          - condition: state
            entity_id: input_boolean.curtailment_manager_enable
            state: "on"
          - condition: state
            entity_id: input_select.sig_override
            state: "Off"
          - condition: not
            conditions:
              - condition: state
                entity_id: input_select.sig_dispatch_policy
                state: "Predbat"
        sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.power_up_cm_stood_down
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.curtailment_manager_enable
          - action: notify.mobile_app_andrew_iphone
            data:
              title: "Power Up — CM stood down"
              message: >-
                Free session open with CM driving
                ({{ states('input_select.sig_dispatch_policy') }}). CM switched off
                for the window; Predbat should start charging within ~10 min.
                SOC {{ states('sensor.sigen_plant_battery_state_of_charge') }}%.

      # --- Window closed and a restore is owed: put CM back ---
      - conditions:
          - condition: state
            entity_id: binary_sensor.octoplus_power_up_active
            state: "off"
          - condition: state
            entity_id: input_boolean.power_up_cm_stood_down
            state: "on"
        sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.curtailment_manager_enable
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.power_up_cm_stood_down
          - action: notify.mobile_app_andrew_iphone
            data:
              title: "Power Up — finished"
              message: >-
                SOC {{ states('sensor.sigen_plant_battery_state_of_charge') }}%.
                CM switched back on.

      # --- Ten minutes in and the free hour is not being used: say so, once ---
      - conditions:
          - condition: trigger
            id: ten_minutes_in
          - condition: state
            entity_id: binary_sensor.octoplus_power_up_active
            state: "on"
          - condition: numeric_state
            entity_id: sensor.sigen_plant_grid_import_power
            below: 0.5
          - condition: numeric_state
            entity_id: sensor.sigen_plant_battery_state_of_charge
            below: 95
        sequence:
          - action: notify.mobile_app_andrew_iphone
            data:
              title: "Power Up — NOT importing"
              message: >-
                10 min into a free session and import is
                {{ states('sensor.sigen_plant_grid_import_power') }} kW.
                SOC {{ states('sensor.sigen_plant_battery_state_of_charge') }}%,
                EMS {{ states('select.sigen_plant_remote_ems_control_mode') }},
                Predbat wants {{ states('input_select.predbat_requested_mode') }},
                policy {{ states('input_select.sig_dispatch_policy') }}.
