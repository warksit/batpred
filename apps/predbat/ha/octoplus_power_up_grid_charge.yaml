# Octoplus Power Up — grid charge
#
# Octopus "Power Up" = FREE ELECTRICITY. Import is free for the window, so the
# right move is to take as much as the plant will accept: charge the battery
# from the grid, then sell it back later at the export rate.
#
# WHAT DECIDES A POWER UP IS NOT HERE. It is one pair of template binary sensors
# in ha/octoplus_session_helpers.yaml, and the reasoning is in
# ha/OCTOPUS_SESSIONS.md. In short: Octopus publish Power Ups and Power Downs on
# ONE feed with no type field, so the calendar cannot be the trigger — it is on
# for both, and triggering off it would grid-charge during a real saving session,
# importing 6.6 kW in the hour you are paid a premium to export.
#
# This automation must never re-implement that test. Four copies of it lived in
# this file before 2026-08-16 (trigger, gate, wait, comment) and the discriminator
# is expected to change when upstream #1590 lands. One definition, one place.
#
# OWNERSHIP — SAME OWNER BOTH SIDES (Andrew, 2026-08-16).
# CM -> session -> CM, or Predbat -> session -> Predbat. Never crossing. The
# window is an hour in the middle of the curtailment day, so in practice CM has
# the wheel, but the automation does not assume it: it CAPTURES who was driving
# and restores exactly that. The previous version cleared `sig_override`, stood
# CM down and disabled the three Predbat mapper automations, then restored only
# CM — leaving the override cleared and the mappers off, for Predbat's own mutex
# to sort out later.
#
# Why all three levers have to move: an override outranks the select in the
# effective-policy sensor, `sig_dispatch_heartbeat` writes nothing only while
# policy == Predbat, and the mappers are Predbat's path to the same registers.
# Anything left live is a second writer fighting us for the hour.
#
# IMPORTANT: Update and commit this file before changing the automation in HA.

id: "1786900000002"
alias: "Octoplus Power Up - grid charge"
description: >-
  During an Octopus Power Up (free electricity) window, stand the current owner
  down and command the plant to import, charging the battery for free. Restores
  whoever was driving on window close, on timeout, and after an HA restart that
  finds the plant still importing.
mode: single
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: binary_sensor.octoplus_power_up_active
    to: "on"
    id: window_open
  - trigger: homeassistant
    event: start
    id: recover

  # Backstop. The sensor edge is the only thing that opens the window, and a
  # missed edge means the whole hour is lost. The sensor re-renders every minute
  # (its template contains now()), so this should be redundant — but "should be"
  # is not a plan when the window is 60 minutes long and does not come round
  # again. Costs at most 5 minutes of the hour if the edge is missed.
  - trigger: time_pattern
    minutes: "/5"
    id: sweep

actions:
  # RECOVERY. A restart mid-window loses the in-flight run, which would strand
  # the plant importing at 6.6 kW with nobody to stop it. Same lesson as the
  # unreachable alert: the restart is the case a state machine forgets.
  #
  # The captured pre-window state does not survive the restart, so recovery
  # restores the common case (CM driving) rather than guessing. Stated plainly
  # in the notification so it can be corrected by hand if it was wrong.
  - if:
      - condition: trigger
        id: recover
    then:
      - if:
          - condition: numeric_state
            entity_id: number.sigen_plant_active_power_fixed_adjustment
            below: -0.01
        then:
          - action: number.set_value
            target:
              entity_id: number.sigen_plant_active_power_fixed_adjustment
            data:
              value: 0
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.curtailment_manager_enable
          - action: notify.mobile_app_andrew_iphone
            data:
              title: "Power Up — recovered after restart"
              message: >-
                HA restarted while the plant was importing. Setpoint reset to 0
                and CM re-enabled. Pre-window owner could not be recovered —
                check the override and the Predbat mappers if they were not CM's.
      - stop: "Recovery path complete"

  # --- WINDOW OPEN ---
  # Gate. Mandatory once the /5 sweep exists: the sweep fires regardless of the
  # window, so without this the automation would stand the owner down every 5
  # minutes all day.
  - condition: state
    entity_id: binary_sensor.octoplus_power_up_active
    state: "on"

  # 1. Capture who is driving, BEFORE anything is changed. This is what makes
  #    the handback symmetric rather than a guess.
  - variables:
      prev_override: "{{ states('input_select.sig_override') }}"
      prev_cm_on: "{{ is_state('input_boolean.curtailment_manager_enable', 'on') }}"
      prev_mappers_on: "{{ is_state('automation.predbat_requested_mode_action', 'on') }}"

  # 2. Take the wheel. Override first: it outranks the select.
  - action: input_select.select_option
    target:
      entity_id: input_select.sig_override
    data:
      option: "Off"
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.curtailment_manager_enable
  # 3. Silence the heartbeat NOW rather than waiting up to 5 min for CM's own
  #    handback cycle — the window is only an hour.
  - action: input_select.select_option
    target:
      entity_id: input_select.sig_dispatch_policy
    data:
      option: "Predbat"
  # 4. Stop Predbat becoming the second writer. Deliberately NOT via
  #    predbat_set_read_only: changing that forces a full inverter reset to
  #    defaults.
  - action: automation.turn_off
    target:
      entity_id:
        - automation.predbat_requested_mode_action
        - automation.predbat_max_charging_limit_action
        - automation.predbat_max_discharging_limit_action
    data:
      stop_actions: true

  # 5. Command the import. Negative = draw from grid. The plant clamps to the
  #    8.8 kW ESS charge limit and the 6.6 kW AC rating, so this asks for the
  #    maximum and lets hardware decide — same pattern as Max Export's 6.6.
  - action: number.set_value
    target:
      entity_id: number.sigen_plant_active_power_fixed_adjustment
    data:
      value: -6.6

  # 6. Report what ACTUALLY happened, two minutes in. If import is still 0.000
  #    something is writing over us and that needs to be known at 14:02, not 15:00.
  - delay:
      minutes: 2
  - action: notify.mobile_app_andrew_iphone
    data:
      title: "Power Up — charging"
      message: >-
        import {{ states('sensor.sigen_plant_grid_import_power') }} kW ·
        battery {{ states('sensor.sigen_plant_battery_power') }} kW ·
        SOC {{ states('sensor.sigen_plant_battery_state_of_charge') }}% ·
        setpoint {{ states('number.sigen_plant_active_power_fixed_adjustment') }}
        {{ '— WARNING: not importing, something is overwriting the setpoint'
           if (states('sensor.sigen_plant_grid_import_power') | float(0)) < 0.5 else '' }}

  # 7. Hold until the window closes. The timeout is the belt to the wait's
  #    braces: if the sensor never goes off the run still reverts.
  - wait_for_trigger:
      - trigger: state
        entity_id: binary_sensor.octoplus_power_up_active
        to: "off"
    timeout:
      minutes: 70
    continue_on_timeout: true

  # --- WINDOW CLOSED: hand back to whoever had it ---
  - action: number.set_value
    target:
      entity_id: number.sigen_plant_active_power_fixed_adjustment
    data:
      value: 0

  # Restore the mappers only if they were on when we arrived. If CM was driving
  # they were already off, and turning them on here would hand Predbat the
  # registers for the seconds before CM's mutex disabled them again.
  - if:
      - condition: template
        value_template: "{{ prev_mappers_on }}"
    then:
      - action: automation.turn_on
        target:
          entity_id:
            - automation.predbat_requested_mode_action
            - automation.predbat_max_charging_limit_action
            - automation.predbat_max_discharging_limit_action

  - if:
      - condition: template
        value_template: "{{ prev_cm_on }}"
    then:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.curtailment_manager_enable

  # Restore the human's override last, so it lands after the machinery is back.
  - if:
      - condition: template
        value_template: "{{ prev_override not in ['Off', 'unknown', 'unavailable', ''] }}"
    then:
      - action: input_select.select_option
        target:
          entity_id: input_select.sig_override
        data:
          option: "{{ prev_override }}"

  - action: notify.mobile_app_andrew_iphone
    data:
      title: "Power Up — finished"
      message: >-
        SOC {{ states('sensor.sigen_plant_battery_state_of_charge') }}%.
        Setpoint reset. Handed back to {{ 'CM' if prev_cm_on else 'Predbat' }}
        {{ '(override ' ~ prev_override ~ ' restored)'
           if prev_override not in ['Off', 'unknown', 'unavailable', ''] else '' }}.
