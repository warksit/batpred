# Predbat Requested Mode → SIG EMS mode mapper
#
# Predbat (SIG refactor architecture) publishes its desired inverter mode to
# input_select.predbat_requested_mode; this automation maps it onto the SIG
# remote EMS control mode entity.
#
# Mode map:
#   Demand             → Maximum Self Consumption
#   Charging           → Command Charging (PV First)   [STOCK]
#   Freeze Charging    → Maximum Self Consumption (+ grid import limit 0)
#   Discharging        → Command Discharging (PV First)
#   Freeze Discharging → Maximum Self Consumption (+ grid import limit 0)
#
# 2026-10-11: Charging is back on the STOCK mapping, PV First.
# It was Grid First from 2026-06-12, because PV First "cannot be relied on to
# pull from grid at night". That was decided on the AC-coupled hardware, before
# the 2026-07-15 swap: the panels were on the SMA then, so the SigenStor had no
# PV of its own. On the DC-coupled SigenStor, Grid First switches the panels OFF.
# Measured live 2026-10-11, same sky, battery charge limit 8.8 kW:
#     Grid First   battery 6.1 kW   PV 0.0 kW   AC import 6.4 kW
#     PV First     battery 8.8 kW   PV 4.7 kW   AC import 4.1 kW
# PV First fills at the battery's limit, takes all the PV, and buys only the
# difference. NOT YET VERIFIED: that PV First imports in a night slot with zero
# PV on this hardware (the June failure mode). First check: 2026-10-11 22:00.
# If it does not import, the fallback is Grid First at night only.
#
# 2026-07-27: SINGLE-WRITER MUTEX IS ENABLE/DISABLE, NOT A CONDITION.
# This automation was disabled at the 2026-07-15 inverter swap (last triggered
# 2026-07-14 23:34) and nothing re-enabled it, so Predbat had no control path to
# the inverter at all — on 07-26 it asked for Discharging twice overnight and
# select.sigen_plant_remote_ems_control_mode never moved.
#
# curtailment_plugin._set_writer() now owns the handoff: exactly one of this
# automation and sig_dispatch_heartbeat is enabled at any time.
#   CM driving  → heartbeat ON,  this OFF
#   handed back → heartbeat OFF, this ON
# So this stays a plain stock mapper with no mutex condition of its own — being
# disabled is the mutex. Do NOT add a policy condition here; that would put the
# rule in two places.
#
# IMPORTANT: Update and commit this file before changing the automation in HA.
# Deploy via ha_config_set_automation config:, NOT python_transform.

id: "predbat_requested_mode_action"
alias: "Predbat Requested Mode Action"
description: >-
  Acts as a mapper for the input_select.predbat_requested_mode to the
  select.sigen_plant_remote_ems_control_mode. Enabled by curtailment_plugin only
  while the Curtailment Manager has handed back.
mode: restart

trigger:
  - entity_id:
      - input_select.predbat_requested_mode
    platform: state

action:
  - action: select.select_option
    target:
      entity_id: select.sigen_plant_remote_ems_control_mode
    data:
      option: >-
        {% if is_state('input_select.predbat_requested_mode', 'Demand') %}Maximum Self Consumption
        {%- elif is_state('input_select.predbat_requested_mode', 'Charging') %}Command Charging (PV First)
        {%- elif is_state('input_select.predbat_requested_mode', 'Freeze Charging') %}Maximum Self Consumption
        {%- elif is_state('input_select.predbat_requested_mode', 'Discharging') %}Command Discharging (PV First)
        {%- elif is_state('input_select.predbat_requested_mode', 'Freeze Discharging') %}Maximum Self Consumption
        {%- endif %}
  - choose:
      - conditions:
          - condition: state
            entity_id: input_select.predbat_requested_mode
            state: "Freeze Charging"
        sequence:
          - data_template:
              entity_id: number.sigen_plant_grid_import_limitation
              value: 0
            action: number.set_value
      - conditions:
          - condition: state
            entity_id: input_select.predbat_requested_mode
            state: "Freeze Discharging"
        sequence:
          - data_template:
              entity_id: number.sigen_plant_grid_import_limitation
              value: 0
            action: number.set_value
      - conditions:
          - condition: not
            conditions:
              - condition: state
                entity_id: input_select.predbat_requested_mode
                state: "Freeze Charging"
              - condition: state
                entity_id: input_select.predbat_requested_mode
                state: "Freeze Discharging"
        sequence:
          - data_template:
              entity_id: number.sigen_plant_grid_import_limitation
              value: 100
            action: number.set_value
