# Voltage Seek Controller — hybrid down-ramp + adaptive climb
#
# Hybrid voltage cap controller. Replaces the old proportional throttle and
# its asymmetric output filter. Single writer to
# input_number.voltage_throttle_filtered_cap.
#
# Behaviour every 5s + on numeric_state above 253V (sub-second):
#   - V >= (target + deadband + range_v)  : cap = 0
#   - V >  (target + deadband)            : cap = min(cap, max(0, dno - (dno/range_v)*(V-target-deadband)))
#                                            ratchet down only — ramp anchored to (target + deadband).
#                                            slope = dno/range_v (range=4 → 1 kW/V steep,
#                                            range=8 → 0.5 kW/V gentle).
#   - target-deadband ≤ V ≤ target+deadband : HOLD (no change)
#                                            symmetric hysteresis band kills micro-thrash when V
#                                            wobbles around target. With deadband=0.5 and target=253
#                                            the band is [252.5, 253.5].
#   - V < (target - deadband)             : cap += step_up_kw (adaptive climb)
#
# Why this shape: pure seek (proportional drop with drop_gain) was too slow on
# 8V-in-5s rises (multiple SIG OVP trips on 2026-05-06). Pure proportional
# ramp from V was the old behaviour — instant response on every V change.
# This uses the old's instant ramp on the way DOWN (cap can only decrease
# via this path) and the seek's adaptive climb on the way UP. Symmetric
# deadband re-introduced 2026-05-07 to kill saw-tooth at the operating point;
# the earlier-removed lower-only deadband stranded cap at low values, the
# symmetric version doesn't (V routinely crosses below target-deadband).
#
# Tunables (live via input_number helpers):
#   input_number.voltage_seek_target_v    — V at centre of hold band
#   input_number.voltage_seek_range_v     — V span from band edge to cap=0
#   input_number.voltage_seek_deadband_v  — half-width of hold band (each side)
#
# Hard-coded constants (edit YAML to change):
#   step_up_base  = 0.05 kW/tick — minimum climb rate (near target)
#   step_up_per_v = 0.05 kW/tick per V below (target - 1) — adaptive
#   step_up_max   = 0.4  kW/tick — cap on climb rate (~4.8 kW/min)
#   dno           = 4.0  kW (DNO export limit)
#
# Adaptive climb keeps motion gentle near target (avoids overshoot) but
# recovers fast after a deep cut: v=target-1 → 0.05/tick, v=target-5 → 0.25/tick,
# v ≤ target-7 → 0.4/tick clamped (4.8 kW/min, ~50s for 0→4 recovery).
#
# IMPORTANT: this is the sole writer to input_number.voltage_throttle_filtered_cap.
# The old "Voltage Throttle Filter — Asymmetric Rate Limit" automation must be
# disabled in HA before enabling this one.
#
# Update and commit this file before changing the automation in HA.

alias: "Voltage Seek Controller"
description: >-
  Hybrid voltage controller: instant proportional ramp DOWN (V=253 cap=4,
  V=257 cap=0, linear), adaptive climb UP. Tick every 5s + immediate
  trigger on V > 254V. Sole writer to
  input_number.voltage_throttle_filtered_cap.
mode: restart
max_exceeded: silent

trigger:
  - platform: time_pattern
    seconds: "/5"
  # Immediate emergency trigger — fast voltage spike, do not wait for tick.
  # Threshold 253 = where the down-ramp delivers a meaningful cut at the
  # default target (252). numeric_state thresholds are static, so this
  # doesn't track helper changes — if you raise target to 255 or higher,
  # this trigger fires earlier than the ramp actually engages, but the
  # action still computes cap correctly from the current V.
  - platform: numeric_state
    entity_id: sensor.sigen_inverter_phase_a_voltage
    above: 253
    id: voltage_spike

action:
  - variables:
      v: "{{ states('sensor.sigen_inverter_phase_a_voltage') | float(240) }}"
      cap: "{{ states('input_number.voltage_throttle_filtered_cap') | float(4) }}"
      target: "{{ states('input_number.voltage_seek_target_v') | float(250) }}"
      range_v: "{{ states('input_number.voltage_seek_range_v') | float(8) }}"
      deadband: "{{ states('input_number.voltage_seek_deadband_v') | float(0.5) }}"
      step_up_base: 0.05
      step_up_per_v: 0.05
      step_up_max: 0.4
      dno: 4.0
      under_v: "{{ target - v }}"
      step_up_kw: "{{ [step_up_max, [step_up_base, step_up_base + step_up_per_v * (under_v | float - 1)] | max] | min }}"
      ramp_start_v: "{{ target + deadband }}"
      ramp_zero_v: "{{ target + deadband + range_v }}"
      hold_low_v: "{{ target - deadband }}"
      # Symmetric hysteresis around target:
      #   ramp DOWN engages at V > (target + deadband). Slope derived from range:
      #     cap_max = max(0, dno - (dno/range_v) × (V - target - deadband))
      #   cap=0 at V=(target + deadband + range_v).
      #   Climb engages at V < (target - deadband).
      #   Hold band [target-deadband, target+deadband] = no change to cap.
      new_cap: >-
        {%- if v >= ramp_zero_v -%}
          0.0
        {%- elif v > ramp_start_v -%}
          {{ [cap, [0.0, dno - (dno / range_v) * (v - target - deadband)] | max] | min }}
        {%- elif v < hold_low_v -%}
          {{ [dno, cap + (step_up_kw | float)] | min }}
        {%- else -%}
          {{ cap }}
        {%- endif -%}

  - action: input_number.set_value
    target:
      entity_id: input_number.voltage_throttle_filtered_cap
    data:
      value: "{{ new_cap | float | round(2) }}"
