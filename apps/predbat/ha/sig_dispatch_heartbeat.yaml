# SIG Dispatch Heartbeat — interim v-next executor (2026-07-18 rev, renamed policies)
#
# THE single writer of the SigenStor control registers. Driven entirely by
# input_select.sig_dispatch_policy — the master control surface. Everything
# else (keep-floor/dusk guard, the future plugin, Predbat mapper, a human)
# sets the POLICY; only this automation touches Remote EMS enable, control
# mode, export limit and PCS dispatch.
#
#   Predbat            → release (RD2): ONE-SHOT handback on the policy_change
#                        trigger only — Remote EMS ON, EMS control mode = Maximum
#                        Self Consumption. NEVER app modes. Thereafter this
#                        automation writes NOTHING while policy == Predbat: the
#                        heartbeat and Predbat must never both be driving.
#                        Predbat controls from EMS-MSC by switching EMS modes via
#                        predbat_requested_mode_action.
#   Max Export         → dispatch = 6.6 (inverter max): command max output and let
#                        grid_export_limitation clamp export to the DNO cap in
#                        hardware — export pinned at 3.68, battery discharges to hold
#                        it below PV, absorbs above. Firmware tracks load at hardware
#                        speed (no heartbeat lag). Drain-floor clamp still applies.
#                        (old Drain)
#   Hold Battery       → dispatch = max(PV, load): battery flat (never absorbs),
#                        exports PV surplus, covers load shortfall from battery. (old Hold)
#   Solar Charge Battery → dispatch = load: absorb all PV surplus into the battery,
#                        zero export, cover the house. (old Charge, R16)
#
# HARD FLOOR (live clamp): SOC ≤ input_number.sig_drain_floor_pct → dispatch ≤ PV
# so the battery can never DISCHARGE below the floor for any policy.
#
# ESS / IMPORT LIMIT RE-OPEN (5bbdedeb, re-applied 2026-07-28): on every
# active-policy run, set
#   number.sigen_plant_ess_max_discharging_limit = rated discharge
#   number.sigen_plant_ess_max_charging_limit    = rated charge
#   number.sigen_plant_grid_import_limitation    = 100
# Predbat's Freeze Charging/Discharging locks the battery via discharge=0 and
# blocks import via import=0. Those are PLANT registers — disabling the mapper
# does not clear them, so without this the heartbeat writes dispatch into a
# hardware-locked battery. The stale-setpoint trigger also fires when discharge
# is <50% of rated or import is 0, so a freeze is cleared within a beat rather
# than waiting for a dispatch drift.
# Seen twice: 2026-07-26 (fixed by 5bbdedeb) and 2026-07-28 (the v8.46.4 port
# predated that commit, so re-deploying from the ported file regressed it —
# SOC flat 44.6% for 4.5 h under Max Export on a clear morning).
#
# Triggers: 1-min backstop beat; policy change; manual-override change; LIVE
# stale-setpoint — the
# template references PV + load, so it re-evaluates on every change and fires
# IMMEDIATELY (no debounce) when the wanted dispatch drifts >0.1 kW from the
# register. The >0.1 gate IS the write filter (no hysteresis needed): self-
# limiting because the load+cap ceiling keeps `want` flat while PV > load+cap,
# so it stays quiet through the overflow peak and only writes on real output
# changes. Reacts to a load/PV step within a beat, not seconds late.
#
# IMPORTANT: update and commit this file before changing the automation in HA.
# Deploy via ha_config_set_automation config: (full replacement), NOT python_transform.

id: "sig_dispatch_heartbeat"
alias: "SIG Dispatch Heartbeat"
description: >-
  Sole writer of SigenStor control registers, driven by
  input_select.sig_dispatch_policy. See repo file header
  (apps/predbat/ha/sig_dispatch_heartbeat.yaml).
mode: restart

trigger:
  - platform: time_pattern
    minutes: "/1"
    id: beat
  - platform: state
    entity_id: input_select.sig_dispatch_policy
    id: policy_change
  # Manual override flips who is driving (RD13), so re-evaluate dispatch at once
  # rather than waiting up to a minute for the beat. Deliberately its OWN id: the
  # one-shot MSC handback below is gated on policy_change only, so toggling the
  # override while already handed back must not re-park the unit.
  - platform: state
    entity_id: input_select.sig_override
    id: override_change
  # RD14c: NATIVE calendar triggers. The Octoplus saving-sessions calendar is
  # "on when a saving session that the account has joined is active", and HA
  # schedules calendar triggers to fire at the exact event boundary — no polling,
  # no template window math, and joined-only so an un-joined session can never
  # make us export for free.
  - platform: calendar
    entity_id: calendar.octopus_energy_a_4ba7c915_octoplus_saving_sessions
    event: start
    id: session_start
  - platform: calendar
    entity_id: calendar.octopus_energy_a_4ba7c915_octoplus_saving_sessions
    event: end
    id: session_end
  - platform: template
    value_template: >-
      {% set rawp = states('input_select.sig_dispatch_policy') %}
      {% set p = 'Max Export' if (is_state('calendar.octopus_energy_a_4ba7c915_octoplus_saving_sessions', 'on') and rawp != 'Predbat') else rawp %}
      {% set cap = (states('input_number.dno_export_limit_w') | float(3680)) / 1000 %}
      {% set load = [states('sensor.sigen_plant_total_load_power') | float(0.5), 0.2] | max %}
      {% set pv = states('sensor.sigen_plant_pv_power') | float(0) %}
      {% set soc = states('sensor.sigen_plant_battery_state_of_charge') | float(50) %}
      {% set hard = states('input_number.sig_drain_floor_pct') | float(2.8) %}
      {% set raw = 6.6 if p == 'Max Export' else ([pv, load] | max if p == 'Hold Battery' else load) %}
      {% set ceil = 6.6 if p == 'Max Export' else [load + cap, 6.6] | min %}
      {% set pre = ([raw, pv] | min if soc <= hard else raw) %}
      {% set want = [[pre, ceil] | min, 0] | max %}
      {% set rated_d = states('sensor.sigen_inverter_ess_rated_discharge_power') | float(6.6) %}
      {% set disc = states('number.sigen_plant_ess_max_discharging_limit') | float(0) %}
      {% set imp = states('number.sigen_plant_grid_import_limitation') | float(100) %}
      {{ p in ['Max Export', 'Hold Battery', 'Solar Charge Battery'] and
         is_state('switch.sigen_plant_remote_ems_controlled_by_home_assistant', 'on') and
         ((states('number.sigen_plant_active_power_fixed_adjustment') | float(0) - want) | abs > 0.1
          or disc < (rated_d * 0.5)
          or imp < 1) }}
    id: stale_setpoint

action:
  - variables:
      cap_kw: "{{ (states('input_number.dno_export_limit_w') | float(3680)) / 1000 }}"
      load_kw: "{{ [states('sensor.sigen_plant_total_load_power') | float(0.5), 0.2] | max }}"
      pv_kw: "{{ states('sensor.sigen_plant_pv_power') | float(0) }}"
      soc_pct: "{{ states('sensor.sigen_plant_battery_state_of_charge') | float(50) }}"
      hard_pct: "{{ states('input_number.sig_drain_floor_pct') | float(2.8) }}"
      # RD14c (2026-07-28): saving sessions come from the Octoplus CALENDAR.
      # It is "on when a saving session that the account has joined is active",
      # and HA schedules calendar triggers at the exact event boundary.
      #
      # Why not the binary sensor: Octopus publishes it ~1 min late (19:00:57 for
      # a 19:00:00 session, observed), and the plugin only re-evaluates on its
      # 5-min cycle — the end edge measured 5 min 46 s late, dumping the battery
      # at the cap past the paid window. ~15% of a 30-min session at each edge.
      session_live: "{{ is_state('calendar.octopus_energy_a_4ba7c915_octoplus_saving_sessions', 'on') }}"
      # RD13a: manual override is the select alone — active iff not "Off", and
      # its value IS the policy. No boolean; there is no second entity to diverge.
      override_choice: "{{ states('input_select.sig_override') }}"
      raw_policy: "{{ states('input_select.sig_dispatch_policy') }}"
      # `| bool` is load-bearing: HA renders `variables` to strings in some
      # contexts and the string "False" is TRUTHY in Jinja — without it a session
      # would start correctly and NEVER release. Caught by
      # test_rd14c_releases_at_the_planned_end, not by review.
      #
      # A live session forces Max Export, but ONLY while CM already holds the
      # wheel. If we have handed back, Predbat owns the machine and its mappers
      # are enabled — seizing control here would put two writers on the registers
      # (the 2026-07-26 / 2026-07-28 failures).
      # Precedence: manual override > live saving session > the plugin's select.
      # A human holding a policy outranks the session dump — they can see something
      # we cannot.
      # ONE expression, not a folded block: a `>-` block leaves trailing whitespace,
      # so "Max Export " would fail every `policy in [...]` comparison below.
      policy: "{{ override_choice if override_choice not in ['Off', 'unknown', 'unavailable', ''] else ('Max Export' if (session_live | bool and raw_policy != 'Predbat') else raw_policy) }}"
      raw_kw: "{{ 6.6 if policy == 'Max Export' else ([pv_kw, load_kw] | max if policy == 'Hold Battery' else load_kw) }}"
      # Ceiling = the most the inverter should push out.
      # - Max Export: 6.6 (inverter AC max) — command max output and let the SIG's
      #   grid_export_limitation clamp export to the DNO cap in HARDWARE. Draining
      #   the battery to hold the cap IS Max Export's intent, so no load-tracking is
      #   needed; the firmware tracks load at hardware speed (no heartbeat lag). The
      #   drain-floor clamp (pre) still bites below sig_drain_floor_pct.
      # - Hold / Solar Charge: load+cap (export-limited), never above 6.6. The
      #   load+cap ceiling is what keeps Hold FLAT (tracks PV); a flat 6.6 would turn
      #   Hold into a battery-draining Max Export on any PV dip.
      ceiling_kw: "{{ 6.6 if policy == 'Max Export' else [load_kw + cap_kw, 6.6] | min }}"
      # Drain-floor clamp — applies to SELLING ONLY (policy == 'Max Export').
      #
      # It used to apply to every policy, which stranded the battery and imported
      # the shortfall. Live 2026-08-06 06:48 under a manual Hold at SOC 1.3%:
      #   pv 0.311, load 0.359 -> raw 0.359 -> clamped to min(raw,pv) = 0.311
      #   battery -0.003 kW (idle), import 0.027 kW
      # The plant was told to output exactly PV, so house load took the difference
      # from the grid while the battery held 0.235 kWh. Because the clamp is applied
      # AFTER policy selection it also overrode the human override — no policy could
      # use the battery below the floor.
      #
      # Stopping the battery SELLING at the floor (R5) and letting it COVER LOAD
      # below it (RD4) are not in conflict; the old form just blocked both at once.
      # Safe to relax because the SIG simply imports at 0% — there is no protection
      # cliff, so the floor is a curtailment-economics choice (Andrew, 2026-08-06).
      # `policy` here is the EFFECTIVE policy, so a session-forced Max Export is
      # still clamped.
      dispatch_kw: "{{ [[ ([raw_kw, pv_kw] | min if (soc_pct <= hard_pct and policy == 'Max Export') else raw_kw), ceiling_kw] | min, 0] | max }}"
      rated_discharge_kw: "{{ states('sensor.sigen_inverter_ess_rated_discharge_power') | float(6.6) }}"
      rated_charge_kw: "{{ states('sensor.sigen_inverter_ess_rated_charge_power') | float(6.6) }}"
      max_discharge_kw: "{{ rated_discharge_kw | float(6.6) | round(2) }}"
      max_charge_kw: "{{ rated_charge_kw | float(6.6) | round(2) }}"
  - choose:
      # Release (Predbat): ONE-SHOT handback, then stay out of the way entirely.
      # STAY in EMS control (RD2) — NEVER turn Remote EMS off / drop to app modes,
      # that leaves the EMS plane and Predbat can't get back in. Predbat controls
      # from within EMS by switching EMS modes via predbat_requested_mode_action.
      #
      # 2026-07-27 FIX — the heartbeat and Predbat must NEVER both be driving.
      # This branch used to re-assert MSC on every run whenever the EMS mode was
      # not MSC. The old comment called that "idempotent … doesn't fight Predbat";
      # it is the exact inverse — it fired precisely when Predbat had just set
      # Command Charging / Command Discharging. The `stale_setpoint` trigger is
      # already gated to the active policies, but the 1-minute `beat` is not, so
      # Predbat's mode was reverted within a minute, every time. That is why
      # enabling predbat_requested_mode_action alone achieves nothing.
      #
      # Now the MSC write fires ONLY on the policy_change trigger — the transition
      # into handback. On the beat this branch writes nothing at all, so while
      # Predbat holds the wheel the heartbeat is inert. The Remote EMS check stays
      # unconditional because Predbat cannot control at all without it, and
      # turning it on is not a control decision.
      #
      # Matching half: the sig_dispatch_policy == 'Predbat' mutex condition in
      # predbat_requested_mode_action.yaml. Change the two together.
      - conditions:
          - "{{ policy == 'Predbat' }}"
        sequence:
          - if:
              - condition: state
                entity_id: switch.sigen_plant_remote_ems_controlled_by_home_assistant
                state: "off"
            then:
              - action: switch.turn_on
                target:
                  entity_id: switch.sigen_plant_remote_ems_controlled_by_home_assistant
              - delay: "00:00:02"
          - if:
              - condition: trigger
                id: policy_change
              - condition: not
                conditions:
                  - condition: state
                    entity_id: select.sigen_plant_remote_ems_control_mode
                    state: "Maximum Self Consumption"
            then:
              - action: select.select_option
                target:
                  entity_id: select.sigen_plant_remote_ems_control_mode
                data:
                  option: "Maximum Self Consumption"
      # Active policy: ensure session open, then re-assert export limit + dispatch
      - conditions:
          - "{{ policy in ['Max Export', 'Hold Battery', 'Solar Charge Battery'] }}"
        sequence:
          - if:
              - condition: state
                entity_id: switch.sigen_plant_remote_ems_controlled_by_home_assistant
                state: "off"
            then:
              - action: switch.turn_on
                target:
                  entity_id: switch.sigen_plant_remote_ems_controlled_by_home_assistant
              - delay: "00:00:02"
          - if:
              - condition: not
                conditions:
                  - condition: state
                    entity_id: select.sigen_plant_remote_ems_control_mode
                    state: "PCS Remote Control"
            then:
              - action: select.select_option
                target:
                  entity_id: select.sigen_plant_remote_ems_control_mode
                data:
                  option: "PCS Remote Control"
          - action: number.set_value
            target:
              entity_id: number.sigen_plant_grid_export_limitation
            data:
              value: "{{ cap_kw | round(2) }}"
          # 2026-07-28: undo any state a PREVIOUS writer left behind. Predbat's
          # Freeze Charging/Discharging locks the battery via
          # ess_max_discharging_limit=0 and blocks import via
          # grid_import_limitation=0. Those are plant registers, not owned by the
          # policy select, so disabling the mapper does NOT clear them — the
          # heartbeat has to re-open them or Max Export writes dispatch into a
          # hardware-locked battery. Regressed twice now (2026-07-26 and again
          # 2026-07-28 when the v8.46.4 port dropped commit 5bbdedeb), both times
          # showing as SOC flat all morning under an active policy.
          - action: number.set_value
            target:
              entity_id: number.sigen_plant_ess_max_discharging_limit
            data:
              value: "{{ max_discharge_kw }}"
            alias: "Open ESS max discharge (undo Predbat freeze)"
          - action: number.set_value
            target:
              entity_id: number.sigen_plant_ess_max_charging_limit
            data:
              value: "{{ max_charge_kw }}"
            alias: "Open ESS max charge"
          - action: number.set_value
            target:
              entity_id: number.sigen_plant_grid_import_limitation
            data:
              value: 100
            alias: "Re-open grid import (undo Predbat freeze)"
          # Mirror the rate helpers back to rated too. The ESS registers above are
          # DERIVED from these by predbat_max_(dis)charging_limit_action — Predbat's
          # freeze sets discharge_rate=0 and that mapper clamps the register. Writing
          # only the register leaves the helper at 0, so the next state change on it
          # re-clamps and the two fight. Resetting the source stops that at origin.
          - action: input_number.set_value
            target:
              entity_id: input_number.discharge_rate
            data:
              value: "{{ (rated_discharge_kw | float(6.6) * 1000) | int }}"
            alias: "Mirror discharge_rate helper (source of the ESS clamp)"
          - action: input_number.set_value
            target:
              entity_id: input_number.charge_rate
            data:
              value: "{{ (rated_charge_kw | float(6.6) * 1000) | int }}"
            alias: "Mirror charge_rate helper"
          - action: number.set_value
            target:
              entity_id: number.sigen_plant_active_power_fixed_adjustment
            data:
              value: "{{ dispatch_kw | float | round(2) }}"
