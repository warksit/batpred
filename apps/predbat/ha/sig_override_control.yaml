# SIG Override Control — single-select manual override (2026-07-28)
#
# PROBLEM THIS SOLVES. Manual override used to need TWO actions in the right
# order: set input_select.sig_dispatch_policy, then turn on
# input_boolean.sig_manual_override. Doing it the other way round — or setting
# the policy and forgetting the toggle — means the plugin re-asserts its own
# policy within ~5 minutes (see the R59b/`_set_policy` re-assertion invariant)
# and the manual choice silently disappears. Observed 2026-07-28 19:04.
#
# Now: ONE select. `input_select.sig_override`:
#   Off                  -> plugin decides (override cleared)
#   Max Export           -> hold that policy until set back to Off
#   Hold Battery
#   Solar Charge Battery
#
# NO `Predbat` option by design. Handing back to Predbat is the plugin's
# decision (RD6 safe_time handback), not a manual mode — "Off" means "you
# decide", which is the honest way to express that.
#
# ORDERING IS LOAD-BEARING: the override boolean is turned ON *before* the
# policy is written. The other order leaves a window where the plugin's next
# cycle can overwrite the policy we just set.
#
# Version control: edit THIS file first, then deploy via `config:` full
# replacement (never python_transform — it reorders keys). See .claude/CLAUDE.md.
id: "sig_override_control"
alias: "SIG Override Control"
description: >-
  Maps input_select.sig_override onto the sig_manual_override boolean and the
  sig_dispatch_policy select, so manual control is one action instead of two.
mode: queued
max: 10

trigger:
  - platform: state
    entity_id: input_select.sig_override
    id: override_select
  # Keep the select honest if the boolean is cleared elsewhere (a script, or a
  # human in the entity list). Without this the select would still read e.g.
  # "Max Export" while the plugin was actually back in control.
  - platform: state
    entity_id: input_boolean.sig_manual_override
    to: "off"
    id: boolean_cleared

action:
  - choose:
      # Boolean cleared elsewhere -> reset the select to Off.
      - conditions:
          - condition: trigger
            id: boolean_cleared
        sequence:
          - if:
              - condition: not
                conditions:
                  - condition: state
                    entity_id: input_select.sig_override
                    state: "Off"
            then:
              - action: input_select.select_option
                target:
                  entity_id: input_select.sig_override
                data:
                  option: "Off"

      # Off -> release: clear the override so the plugin resumes writing policy.
      # Deliberately does NOT set a policy; the plugin picks one on its next cycle.
      - conditions:
          - condition: trigger
            id: override_select
          - condition: state
            entity_id: input_select.sig_override
            state: "Off"
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.sig_manual_override

      # Any real policy -> take control. Override ON FIRST (see header), then
      # write the policy, so the plugin cannot overwrite it in between.
      - conditions:
          - condition: trigger
            id: override_select
        sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.sig_manual_override
          - action: input_select.select_option
            target:
              entity_id: input_select.sig_dispatch_policy
            data:
              option: "{{ states('input_select.sig_override') }}"
