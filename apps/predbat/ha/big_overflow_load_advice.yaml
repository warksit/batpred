# Big Overflow Day Load Advice
# Reminder when PV forecast overflow exceeds battery capacity for a sustained period.
# Suggests running discretionary loads to capture extra solar.
#
# Behaviour: polls every 15 min during the curtailment window. Alerts when
# binary_sensor.big_overflow_shortfall has been continuously `on` for:
#   - 120 min (2h dwell) if before 12:00 — high confidence required, plenty
#     of time to run loads
#   - 30 min if 12:00 onwards — day's running out, can't wait
# Fires at most ONCE per day.
# Silent on normal days (forecast within battery capacity).
#
# Companion entity:
#   binary_sensor.big_overflow_shortfall — template binary sensor
#     ON when (overflow_kwh - battery_room) >= 1 kWh
#     OFF otherwise
#
# Sent to both Andrew and Shona since it's a friendly suggestion.

id: "big_overflow_load_advice_v1"
alias: "Big Overflow Day - Load Advice"
description: >-
  Alert when battery shortfall has persisted long enough to be confident:
  2h before noon, 30 min after. Once per day max.

mode: single
max_exceeded: silent

trigger:
  - platform: time_pattern
    minutes: "/15"

condition:
  - condition: state
    entity_id: sensor.predbat_curtailment_phase
    state: "Active"
  - condition: state
    entity_id: binary_sensor.big_overflow_shortfall
    state: "on"
  # Only before safe_time
  - condition: template
    value_template: >-
      {{ now().strftime('%H:%M') < (state_attr('sensor.predbat_curtailment_phase', 'safe_time') or '23:59') }}
  # Once per day max
  - condition: template
    value_template: >-
      {{ this.attributes.last_triggered is none or as_timestamp(this.attributes.last_triggered) < as_timestamp(today_at()) }}
  # Dynamic dwell: require 2h before noon, 30 min after
  - condition: template
    value_template: >-
      {% set sensor = states.binary_sensor.big_overflow_shortfall %}
      {% set on_for_min = (now() - sensor.last_changed).total_seconds() / 60 %}
      {% set required_min = 120 if now().hour < 12 else 30 %}
      {{ on_for_min >= required_min }}

action:
  - variables:
      overflow_kwh: "{{ state_attr('sensor.predbat_curtailment_phase', 'overflow_kwh') | float(0) }}"
      soc_pct: "{{ states('sensor.sigen_plant_battery_state_of_charge') | float(0) }}"
      soc_max: 18.08
      soc_kwh: "{{ (soc_pct / 100) * soc_max }}"
      room_kwh: "{{ soc_max - soc_kwh }}"
      shortfall_kwh: "{{ (overflow_kwh - room_kwh) | round(1) }}"
      safe_time: "{{ state_attr('sensor.predbat_curtailment_phase', 'safe_time') }}"

  - action: notify.mobile_app_andrew_iphone
    data:
      title: "☀️ Big PV day — run extra loads"
      message: >-
        ☀️ Forecast overflow {{ overflow_kwh | round(1) }} kWh, battery room
        🔋 {{ room_kwh | round(1) }} kWh. About {{ shortfall_kwh }} kWh of solar
        going to waste (until safe_time {{ safe_time }}) unless we soak it up.
        Good time to run: 🍽️ dishwasher, 🧺 washing machine, 🚗 EV, ♨️ immersion.

  - action: notify.mobile_app_shona_s_ipad
    data:
      title: "☀️ Big PV day — run extra loads"
      message: >-
        ☀️ Forecast overflow {{ overflow_kwh | round(1) }} kWh, battery room
        🔋 {{ room_kwh | round(1) }} kWh. About {{ shortfall_kwh }} kWh of solar
        going to waste (until safe_time {{ safe_time }}) unless we soak it up.
        Good time to run: 🍽️ dishwasher, 🧺 washing machine, 🚗 EV, ♨️ immersion.
