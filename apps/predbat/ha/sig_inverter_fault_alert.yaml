# SIG Inverter Fault Alert
# HA automation: detects when SIG inverter active power is stuck near zero for 2+ minutes.
#
# Distinguishes between:
#   - Benign G99 protective disconnects (Shutdown/Environmental/Standby) — non-critical
#     sound, auto-recovers 3-5 min. Message says "No action needed".
#   - Genuine faults (Running-but-idle meter fault, unknown states) — critical sound,
#     action required.
#
# Message includes voltage and frequency for diagnosis (requires
# sensor.sigen_inverter_grid_frequency to be enabled in the Sigen integration).
#
# IMPORTANT: Update and commit this file before changing the automation in HA.

id: "1774884719302"
alias: "SIG Inverter Fault Alert"
description: >-
  Alert on SIG leaving Running state for >15s (catches brief protective disconnects
  like 100-sec Environmental Abnormality events) OR active_power stuck near zero for
  2+ minutes (meter communication fault with SIG still Running).
  Benign G99 states (Shutdown/Environmental/Standby) use non-critical sound;
  genuine faults use critical.
mode: single
max_exceeded: silent

triggers:
  # Catches brief protective disconnects (100-sec Environmental Abnormality, etc)
  - trigger: state
    entity_id: sensor.sigen_plant_plant_running_state
    from: "Running"
    to:
      - "Shutdown"
      - "Environmental Abnormality"
      - "Standby"
      - "Fault"
    for:
      seconds: 15
  # Catches meter comm fault (SIG still Running but active_power stuck near zero)
  - trigger: numeric_state
    entity_id: sensor.sigen_inverter_active_power
    above: -0.01
    below: 0.01
    for:
      minutes: 2
  # Catches the grid CT / electric-meter comms fault while the plant keeps
  # RUNNING NORMALLY (mySigen alert 4001, "Electric meter communication
  # anomaly"). 2026-08-10: the fault started 08:23:58 and HA said nothing for
  # over three hours, because the only meter trigger above keys off the inverter
  # going idle — and it never did. It produced 4.4 kW straight through.
  #
  # STALENESS, not value. Two reasons value tests do not work here:
  #   1. The fault presents in at least two ways. Before the reboot
  #      consumed_power read 3.679 kW (= AC output, grid attributed to the
  #      house); after it, 0.000. A threshold catching one misses the other.
  #   2. grid power is legitimately ~0 during Solar Charge, which targets zero
  #      grid flow by design — so "grid == 0" would false-alarm every time.
  # A live CT jitters constantly. Measured 2026-08-10 09:34: grid_active_power,
  # grid_import_power and grid_export_power all frozen 2175 s while pv_power and
  # battery_power in the SAME Modbus poll updated every 1-2 s. The poll-liveness
  # term is what makes this specific: it says "the plant is talking, the meter
  # is not", so an integration outage or an HA restart cannot trigger it.
  #
  # Caveat, accepted: an HA restart re-stamps last_changed, so grid_age resets
  # to 0 and the alert goes quiet for 10 min of uptime before it can re-fire.
  # That is a self-healing FALSE NEGATIVE, never a false alarm, so it is the
  # safe direction. A restart-proof version would need an input_datetime stamped
  # on the last genuine grid reading — more moving parts than this is worth.
  #
  # A template trigger only fires on a false->true transition, so deploying this
  # DURING an outage does not raise it for the outage already in progress
  # (2026-08-10: fired manually to verify, trace showed meter_dead=true,
  # grid_age_s=2596, poll_age_s=4).
  - trigger: template
    id: meter_stale
    note: >-
      Grid CT stale while the plant still polls. Staleness not value: the fault
      presented as consumed_power=3.679 (=AC out) before a reboot and 0.000
      after, and grid power is legitimately ~0 during Solar Charge. A live CT
      jitters. Not expressible as a native trigger - it compares last_changed
      across three entities.
    value_template: >-
      {% set grid_age = (now() - states.sensor.sigen_plant_grid_active_power.last_changed).total_seconds() %}
      {% set poll_age = [(now() - states.sensor.sigen_plant_pv_power.last_changed).total_seconds(),
                         (now() - states.sensor.sigen_plant_battery_power.last_changed).total_seconds()] | min %}
      {{ grid_age > 600 and poll_age < 120 }}
    for:
      minutes: 2

actions:
  - variables:
      running_state: "{{ states('sensor.sigen_plant_plant_running_state') }}"
      voltage: "{{ states('sensor.sigen_inverter_phase_a_voltage') }}"
      freq: "{{ states('sensor.sigen_inverter_grid_frequency') }}"
      is_protective: "{{ states('sensor.sigen_plant_plant_running_state') in ['Shutdown', 'Environmental Abnormality', 'Standby'] }}"
      # 2026-07-28: "Running but idle" has TWO causes and they need different actions.
      # This alert used to assume a meter fault and send you to mySigen. On 2026-07-28
      # it fired correctly at 05:33 — the battery was hardware-clamped by a stale
      # Predbat freeze (ess_max_discharging_limit=0 since 04:01, Max Export commanding
      # 6.6 kW into a locked battery) — but mySigen showed no alerts, so it read as a
      # false alarm and was dismissed. The lockout then ran until 08:35.
      # Correct detection, wrong diagnosis, so the alert trained us to ignore it.
      # Both registers are already in HA, so distinguish them here.
      disch_limit: "{{ states('number.sigen_plant_ess_max_discharging_limit') | float(0) }}"
      rated_disch: "{{ states('sensor.sigen_plant_ess_rated_discharging_power') | float(9.6) }}"
      import_limit: "{{ states('number.sigen_plant_grid_import_limitation') | float(100) }}"
      # 2026-08-05: a shut limit is only a FAULT when it is nobody's intent.
      # Predbat's Hold/Freeze charging deliberately locks the battery via
      # discharge_rate=0 -> ess_max_discharging_limit=0 and import_limit=0, and it
      # does so every night it holds SOC at its target. Fired 05:43 on a
      # "Hold charging target 6%-6%"; CM took the wheel at 05:55 and the heartbeat
      # re-opened the limits 4 s later. Correct detection, but the ACTION text sent
      # you after a disabled heartbeat and a zero discharge_rate that were both
      # CORRECT at the time — i.e. it trains you to ignore it, which is exactly how
      # the real 2026-07-28 lockout got dismissed.
      # Ownership is the discriminator: CM driving + limits shut = fault;
      # Predbat driving + Predbat in a freeze = intended, and self-clearing.
      predbat_owns: "{{ states('input_select.sig_dispatch_policy') == 'Predbat' }}"
      predbat_freezing: "{{ states('input_select.predbat_requested_mode') in ['Freeze Charging', 'Freeze Discharging'] }}"
      intended_freeze: "{{ predbat_owns and predbat_freezing }}"
      is_clamped: "{{ (disch_limit < (rated_disch * 0.5) or import_limit < 1) and not intended_freeze }}"
      # Meter liveness — same test as the `meter_stale` trigger, recomputed here
      # because HA gives triggers no access to `variables` and vice versa. Both
      # copies are listed in the REQUIREMENTS.md duplicate-logic index and the
      # Jinja harness renders both and asserts they agree.
      grid_age_s: "{{ (now() - states.sensor.sigen_plant_grid_active_power.last_changed).total_seconds() | round(0) }}"
      poll_age_s: "{{ [(now() - states.sensor.sigen_plant_pv_power.last_changed).total_seconds(), (now() - states.sensor.sigen_plant_battery_power.last_changed).total_seconds()] | min | round(0) }}"
      meter_dead: "{{ grid_age_s | float(0) > 600 and poll_age_s | float(999) < 120 }}"
      fault_type: >-
        {% set s = states('sensor.sigen_plant_plant_running_state') %}
        {% if meter_dead %}METER DEAD - the grid CT has stopped reporting. Grid power frozen at {{ states('sensor.sigen_plant_grid_active_power') }} kW for {{ (grid_age_s | float(0) / 60) | round(0) }} min while the plant polls normally (PV {{ states('sensor.sigen_plant_pv_power') }} kW, updated {{ poll_age_s }}s ago). Consumed power is DERIVED, not measured, so load and export figures are fiction and curtailment control is flying blind on load. Export REVENUE is unaffected (Octopus meters that separately). ACTION: power-cycle the grid meter at the switch IN the tack room that feeds it (30 s off). mySigen alert 4001. A plant reboot does NOT clear it (tried 2026-08-10).
        {% elif s == 'Running' and is_clamped %}Battery CLAMPED - inverter running but idle because the ESS limits are shut, not a meter fault. discharge_limit={{ disch_limit }}kW (rated {{ rated_disch }}), import_limit={{ import_limit }}. Predbat is NOT deliberately freezing (policy={{ states('input_select.sig_dispatch_policy') }}, requested_mode={{ states('input_select.predbat_requested_mode') }}), so this is a stale clamp nobody owns. ACTION: check sig_dispatch_heartbeat is enabled and input_number.discharge_rate is not 0.
        {% elif s == 'Running' %}Meter Communication Fault - inverter running but idle, limits are open so likely lost meter connection. ACTION: Check mySigen app for alert 4001_2. May need meter power cycle.
        {% elif s == 'Shutdown' %}SIG Protective Disconnect (Shutdown) - G99 grid protection. Auto-recovers in 3-5 min. No action needed.
        {% elif s == 'Environmental Abnormality' %}SIG Environmental Abnormality - grid voltage/frequency excursion. Auto-recovers in 1-2 min. No action needed.
        {% elif s == 'Standby' %}SIG Standby - recovering from protective disconnect. No action needed.
        {% else %}SIG Inverter Fault ({{ s }}) - check inverter.
        {% endif %}
      # The same fault, written for whoever is AT the house. Only someone on
      # site can fix a meter comms fault, and the diagnostic text above is
      # useless to them — register names and Sub1G links are not instructions.
      # Jargon you cannot act on is how an alert teaches you to ignore it, which
      # is the 2026-07-28 lesson in a different costume.
      #
      # Names the actual fix (Andrew, 2026-08-10): the meter needs a power cycle
      # and lives in its own small consumer unit above the tack room roof.
      # Identified by LOCATION, not product name — "Sub1G" is on no label she
      # will be looking at, and the tack room roof is unambiguous. The first cut
      # withheld the procedure because the install was unknown here; that was
      # right while it was unknown and wrong to leave once it was not, because
      # "ring Andrew" costs a phone call every single time.
      household_message: >-
        Middlemuir solar: the electricity meter has stopped talking to the
        battery system ({{ (grid_age_s | float(0) / 60) | round(0) }} minutes
        ago). The solar and battery are still working normally and nothing is at
        risk — but the system cannot read the meter, so it is running blind.
        What to do: the meter needs switching off and on again. There is a
        switch in the tack room that powers it — switch that off, wait about 30
        seconds, then switch it back on, and give it a few minutes to
        reconnect. Andrew has had the technical alert too and can talk you
        through it if anything looks different to that.
      soc: "{{ states('sensor.sigen_plant_battery_state_of_charge') }}"
      pv: "{{ states('sensor.sigen_plant_pv_power') }}"

  - action: notify.mobile_app_andrew_iphone
    data:
      title: "SIG Inverter Alert"
      message: "{{ fault_type }}\nSOC: {{ soc }}% | PV: {{ pv }} kW | V: {{ voltage }} | f: {{ freq }} Hz"
      data:
        push:
          sound:
            name: "default"
            critical: "{{ 0 if is_protective else 1 }}"
            volume: 0.5

  # A dead meter is the ONE fault only someone on site can clear, so it is the
  # one that goes to the household as well. Everything else here (battery
  # clamps, G99 disconnects, Predbat freezes) is remote-actionable and would be
  # pure noise on their phones.
  #
  # NOT critical, unlike Andrew's copy: critical overrides silent mode and Do
  # Not Disturb, and this can fire at 03:00 as easily as at noon. Nothing is
  # damaged by a meter that cannot count, and export revenue is unaffected
  # (Octopus meters that independently) — so it can wait until morning.
  - if:
      - condition: template
        value_template: "{{ meter_dead }}"
    then:
      - action: notify.mobile_app_iphone
        data:
          title: "Middlemuir solar — needs a look"
          message: "{{ household_message }}"
          data:
            push:
              sound:
                name: "default"
                critical: "0"
                volume: 0.5
      - action: notify.mobile_app_shona_s_ipad
        data:
          title: "Middlemuir solar — needs a look"
          message: "{{ household_message }}"
          data:
            push:
              sound:
                name: "default"
                critical: "0"
                volume: 0.5
