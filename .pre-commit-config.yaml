repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  - id: file-contents-sorter
    files: ^(\.cspell\/custom-dictionary-workspace.txt|requirements\.txt)$
    args: ["--ignore-case", "--unique"]
  - id: trailing-whitespace
    args: [--markdown-linebreak-ext=md]
  - id: end-of-file-fixer
  - id: check-yaml
    exclude: (example_chart.yml)
  - id: check-json
    exclude: ^(\.cspell\.json|\.devcontainer\/devcontainer\.json)$
- repo: https://gitlab.com/bmares/check-json5
  rev: v1.0.0
  hooks:
  - id: check-json5
    files: ^(\.cspell\.json|\.devcontainer\/devcontainer\.json)$
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.11.4
  hooks:
  # Run the linter.
  - id: ruff
    args: [--select=F401, --fix]
  # Complexity RATCHET for the curtailment code we maintain (not upstream
  # Predbat files — those have 147 functions over the .flake8 limit and are not
  # ours to fix). .flake8 sets max-complexity=15 but flake8 is not run by
  # pre-commit, so that limit has never been enforced.
  #
  # 49 is `calculate`'s complexity as of 2026-07-28 — the point of this hook is
  # that nothing gets WORSE. Lower the number as functions are split; never
  # raise it. Splitting `calculate` along its existing phase boundaries is the
  # tracked follow-up.
  - id: ruff
    alias: ruff-complexity-ratchet
    name: ruff complexity ratchet (curtailment)
    args: [--select=C901, --config, "lint.mccabe.max-complexity=49"]
    files: ^apps/predbat/(curtailment_plugin|curtailment_calc|cold_weather_plugin|soc_keep_publish_plugin)\.py$
- repo: https://github.com/psf/black
  rev: 23.11.0
  hooks:
  - id: black
# - repo: https://github.com/PyCQA/isort
#   rev: 5.12.0
#   hooks:
#   - id: isort
- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.37.0
  hooks:
  - id: markdownlint-fix # Configure in .mdlrc
    exclude: ^(docs/superpowers/|\.claude/) # internal planning artifacts, not published docs
- repo: https://github.com/streetsidesoftware/cspell-cli
  rev: v8.0.0
  hooks:
  - id: cspell
    additional_dependencies:
    - "@cspell/dict-en-gb"
    exclude: ^docs/superpowers/ # internal planning artifacts, not published docs
exclude: |
  ^\.venv/|
  \.backup$
